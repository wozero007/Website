name: Auto-Update Gallery

on:
  push:
    paths:
      - 'images/photography/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate Image List
        run: |
          echo "const photographyImages = [" > js/image_list.js
          find images/photography -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.gif" \) -printf '    "%f",\n' | sort >> js/image_list.js
          echo "];" >> js/image_list.js

      - name: Commit changes
        run: |
          git config user.name "Action Bot"
          git config user.email "bot@noreply.github.com"
          git add js/image_list.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update gallery list" && git push)
