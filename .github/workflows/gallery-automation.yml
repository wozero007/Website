name: Automate Gallery Processing

on:
  push:
    paths:
      - 'images/photography/Originals/**'
      - 'process_gallery.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-images:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow pillow-avif-plugin

      - name: Process Images
        run: python process_gallery.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Automated gallery update: Processed new images in Originals and Thumbs"
