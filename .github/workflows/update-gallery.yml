name: Update Gallery Image List

on:
  push:
    paths:
      - 'images/photography/**'
  workflow_dispatch: # Allows manual trigger button on GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Image List
        run: |
          # Start the JS array
          echo "const photographyImages = [" > js/image_list.js
          
          # Find images, sort them, and format as JS strings
          # We use printf to create line "    'filename',"
          find images/photography -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) -printf '    "%f",\n' | sort >> js/image_list.js
          
          # Close the JS array
          echo "];" >> js/image_list.js
          
          # Debug: Show the file content in the logs
          cat js/image_list.js

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/image_list.js
          # Only commit if file changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update gallery list [skip ci]" && git push)
